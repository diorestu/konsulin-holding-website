<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsulin Group Holding | Vanilla JS SPA Layout</title>
  <meta name="description" content="Single Page Application dan Layout Framework Vanilla JS PT Konsulin Corpora Utama Tbk - Luxury Navy & Gold.">
  <meta name="robots" content="index, follow">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Page transition animation -->
  <style>
    .vanilla-page-fade {
      animation: pageFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .spa-badge-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(197, 160, 89, 0.15);
      border: 1px solid var(--border-gold);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      color: var(--gold-300);
      font-weight: 600;
      margin-left: 0.5rem;
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Root Mount Container untuk Vanilla JS Layout Framework -->
  <div id="app">
    <!-- Konten otomatis dirender oleh Vanilla JS Layout Framework (vanilla-framework.js) -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050a14; color: var(--gold-400);">
      <div style="text-align: center;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(197, 160, 89, 0.2); border-top-color: var(--gold-400); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.2rem auto;"></div>
        <div style="font-family: 'Gilroy', sans-serif; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em;">Memuat Konsulin Group Framework...</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Vanilla JS Framework Script -->
  <script src="js/vanilla-framework.js"></script>
</body>
</html>
